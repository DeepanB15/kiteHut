[alembic]
script_location = migrations
prepend_sys_path = ../..
version_path_separator = os
dialect = postgresql
sqlalchemy.url = postgresql+psycopg2://repolens:repolens@localhost:5432/repolens

[post_write_hooks]
# post_write_hooks defines operations that should be performed after
# a new migration script is generated
# empty hooks can be used to disable default operations
dependency = sendmail
# empty array

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
