[project]
name = "repolens"
version = "0.1.0"
description = "RepoLens — AI-powered repository intelligence and engineering analysis platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
ignore = ["examples/sample-python-repo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
