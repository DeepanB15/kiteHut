# ============================================================
# RepoLens CI — runs on push and pull requests
#
# Jobs:
#   1. backend-tests  — phase integration harnesses + pytest
#   2. frontend-build — TypeScript check + Vite production build
#   3. docker-build   — verifies both images build
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run phase integration harnesses
        run: |
          python -m tests.test_phase3_integration
          python -m tests.test_phase4_integration
          python -m tests.test_phase5_integration
          python -m tests.test_phase7_integration
          python -m tests.test_phase8_integration
          python -m tests.test_phase9_integration
          python -m tests.test_phase10_integration

      - name: Run pytest (Phase 8/9/10 API tests)
        run: pytest -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build